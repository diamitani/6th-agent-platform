version: '3.8'

services:
  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - 6th-agent-network

  # Backend (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/6th_agent
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_HOST=http://ollama:11434
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    depends_on:
      - postgres
      - redis
      - ollama
    networks:
      - 6th-agent-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # PostgreSQL with pgvector
  postgres:
    image: ankane/pgvector:latest
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=6th_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - 6th-agent-network

  # Redis (Cache & Task Queue)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - 6th-agent-network
    command: redis-server --appendonly yes

  # Ollama (LLM Runtime)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - 6th-agent-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Signal CLI (for Signal channel integration)
  signal-cli:
    image: bbernhard/signal-cli-rest-api:latest
    ports:
      - "8080:8080"
    environment:
      - MODE=json-rpc
    volumes:
      - signal_data:/home/.local/share/signal-cli
    networks:
      - 6th-agent-network
    restart: unless-stopped

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    networks:
      - 6th-agent-network
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  minio_data:
  signal_data:

networks:
  6th-agent-network:
    driver: bridge
