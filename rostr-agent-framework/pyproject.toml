[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rostr-framework"
version = "0.1.0"
description = "Open Source Agent Team Operating System"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Patrick Diamitani", email = "patrick@rostr.ai" }
]
maintainers = [
    { name = "Patrick Diamitani", email = "patrick@rostr.ai" }
]
keywords = [
    "ai",
    "agents",
    "multi-agent",
    "llm",
    "orchestration",
    "rag",
    "autonomous"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "aiofiles>=23.2.1",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "requests>=2.31.0",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
supabase = [
    "supabase>=2.3.0",
    "pgvector>=0.2.0",
]
redis = [
    "redis>=5.0.0",
]
all = [
    "rostr-framework[dev,supabase,redis]",
]

[project.urls]
Homepage = "https://rostr.ai"
Documentation = "https://docs.rostr.ai"
Repository = "https://github.com/rostr-ai/rostr"
Issues = "https://github.com/rostr-ai/rostr/issues"
Changelog = "https://github.com/rostr-ai/rostr/blob/main/CHANGELOG.md"

[project.scripts]
rostr = "cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["rostr", "cli"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = [
    "--cov=rostr",
    "--cov-report=html",
    "--cov-report=term-missing",
]
